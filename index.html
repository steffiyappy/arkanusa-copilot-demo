<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Arkanusa Group — access</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;
 background:linear-gradient(135deg,#0C1526 0%,#1F2D55 42%,#0B5A9E 100%);
 min-height:100vh;display:flex;align-items:center;justify-content:center;
 overflow:hidden;position:relative}
.orbs{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.16;
 animation:f 9s ease-in-out infinite}
.o1{width:500px;height:500px;background:#00A8A8;top:-110px;left:-110px}
.o2{width:400px;height:400px;background:#D9822B;bottom:-110px;right:-110px;animation-delay:3s}
.o3{width:320px;height:320px;background:#0078D4;top:50%;left:50%;
 transform:translate(-50%,-50%);animation-delay:1.5s}
@keyframes f{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-28px) scale(1.05)}}
.card{background:rgba(255,255,255,.07);backdrop-filter:blur(24px);
 border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:44px;
 width:420px;max-width:94vw;box-shadow:0 30px 70px rgba(0,0,0,.42);
 position:relative;z-index:2;text-align:center}
.badge{display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.1);
 border:1px solid rgba(255,255,255,.2);border-radius:40px;padding:7px 18px;margin-bottom:18px}
.dot{width:9px;height:9px;border-radius:50%;background:#00E5C0;box-shadow:0 0 10px #00E5C0}
.badge span{color:rgba(255,255,255,.82);font-size:11px;font-weight:600;
 letter-spacing:1.4px;text-transform:uppercase}
h1{color:#fff;font-size:25px;font-weight:700;line-height:1.2;margin-bottom:8px}
h1 em{font-style:normal;color:#5FE3D6}
.sub{color:rgba(255,255,255,.58);font-size:13.5px;margin-bottom:28px;line-height:1.5}
label{display:block;color:rgba(255,255,255,.78);font-size:12.5px;font-weight:600;
 margin-bottom:8px;text-align:left;letter-spacing:.4px}
.iw{position:relative}
.pw{width:100%;padding:14px 48px 14px 16px;background:rgba(255,255,255,.09);
 border:1.5px solid rgba(255,255,255,.2);border-radius:11px;color:#fff;font-size:15px;
 font-family:inherit;outline:none;transition:all .2s;letter-spacing:.5px}
.pw:focus{border-color:#00A8A8;background:rgba(255,255,255,.13);
 box-shadow:0 0 0 4px rgba(0,168,168,.15)}
.pw::placeholder{color:rgba(255,255,255,.3)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;
 display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.07);
 border:1px solid rgba(255,255,255,.13);border-radius:8px;cursor:pointer;
 color:rgba(255,255,255,.7);font-size:16px;padding:0;transition:all .18s}
.eye:hover{color:#00E5C0;background:rgba(0,168,168,.15);border-color:rgba(0,168,168,.4)}
.btn{width:100%;padding:15px;margin-top:18px;background:linear-gradient(135deg,#0078D4,#00A8A8);
 border:none;border-radius:11px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;
 transition:all .2s;letter-spacing:.4px;box-shadow:0 8px 24px rgba(0,120,212,.36);
 font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,120,212,.46)}
.err{display:none;background:rgba(220,38,38,.16);border:1px solid rgba(220,38,38,.32);
 border-radius:9px;padding:11px 15px;color:#FCA5A5;font-size:12.5px;margin-top:15px}
.err.show{display:block}
.hint{color:rgba(255,255,255,.3);font-size:11.5px;margin-top:20px}
</style></head><body>
<div class="orbs"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<div class="card">
  <div class="badge"><span class="dot"></span><span>Microsoft 365 Copilot</span></div>
  <h1>Arkanusa Group<br><em>Microsoft 365 Copilot demonstration hub</em></h1>
  <p class="sub">9 segments &middot; 68 minutes &middot; four acts</p>
  <label for="pw">Access password</label>
  <div class="iw">
    <input type="password" class="pw" id="pw" autocomplete="current-password"
           placeholder="Enter access password"
           onkeydown="if(event.key==='Enter')go()">
    <button type="button" class="eye" id="eb" onclick="tog()"
            aria-label="Show password" aria-pressed="false">&#128065;</button>
  </div>
  <button class="btn" onclick="go()">Enter</button>
  <div class="err" id="err">Incorrect password. Please try again.</div>
  <p class="hint">Restricted to the Microsoft demonstration team.</p>
</div>
<script>
async function sha(m){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(m));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function go(){
  const v=document.getElementById('pw').value;
  if(await sha(v)==='5db9e67aed5472ed48f609b96529415bf36c4756df8c87a5a98ddec5aace76a0'){
    sessionStorage.setItem('hub_auth','ok');
    location.href='hub.html';
  }else{
    const e=document.getElementById('err'),i=document.getElementById('pw');
    e.classList.add('show'); i.style.borderColor='rgba(220,38,38,.6)';
    setTimeout(()=>{e.classList.remove('show');
      i.style.borderColor='rgba(255,255,255,.2)';},3000);
  }
}
function tog(){
  const i=document.getElementById('pw'),b=document.getElementById('eb');
  const hid=i.type==='password';
  const s=i.selectionStart,e=i.selectionEnd;
  i.type=hid?'text':'password';
  b.innerHTML=hid?'&#128584;':'&#128065;';
  b.setAttribute('aria-pressed',hid?'true':'false');
  i.focus(); try{i.setSelectionRange(s,e)}catch(_){}
}
if(sessionStorage.getItem('hub_auth')==='ok')location.href='hub.html';
</script></body></html>
